[build]
command = ""
publish = "."

# NOT: Bu bir çok-sayfalı (multi-page) statik sitedir, SPA değildir.
# Temiz URL'ler (/hakkimizda vb.) Netlify'ın "Pretty URLs" özelliğiyle
# otomatik sunulur; .html -> temiz URL 301 yönlendirmeleri _redirects
# dosyasında tanımlıdır. Bu yüzden "/* -> /index.html 200" gibi bir SPA
# catch-all KULLANILMAZ — aksi halde var olmayan her adres ana sayfayı
# 200 durumuyla döndürür (soft-404) ve SEO'ya zarar verir.

# Form submission redirect
[[redirects]]
from = "/form/success"
to = "/?form=success"
status = 200

[[redirects]]
from = "/form/error"
to = "/?form=error"
status = 200

# Security headers
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "SAMEORIGIN"
X-Content-Type-Options = "nosniff"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# Cache optimization
[[headers]]
for = "/*.{js,css,woff2}"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.html"
[headers.values]
Cache-Control = "public, max-age=3600"

[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"
